<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alerte — Paroles</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

  <style>
    body {
      padding: 2.5rem 1rem 4rem;
    }

    .lyrics-verse + .lyrics-verse {
      margin-top: 1.5rem;
    }

    .lyrics-label {
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .lyrics-text {
      white-space: pre-line;
      margin-bottom: 0;
    }

    [dir="rtl"] .lyrics-text {
      text-align: right;
    }

    .repeat-count {
      color: var(--bs-secondary-color);
      font-size: 0.8em;
      font-weight: 600;
      letter-spacing: 0.02em;
    }


  </style>
</head>

<body data-bs-theme="light">
  <div class="container" style="max-width: 720px;">
    <div class="d-flex justify-content-between align-items-start gap-2 mb-4">
      <div class="d-flex flex-column">
        <h1 class="h3 mb-0">Alerte</h1>
        <p class="text-body-secondary mb-0 d-flex align-items-center gap-1" id="subtitle">
          <span id="subtitleText">Exercises in Style</span>
          <a id="subtitleLink" href="https://en.wikipedia.org/wiki/Exercises_in_Style" target="_blank" rel="noopener" aria-label="Wikipedia" class="d-inline-flex text-body-secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </a>
        </p>
        <p class="text-body-secondary mb-0" id="subtitleCount">Thirty Variations on Alerte</p>
      </div>
      <div class="d-flex flex-column align-items-end gap-2">
        <div class="d-flex align-items-center gap-2">
          <button type="button" class="btn btn-light btn-sm rounded-pill d-inline-flex align-items-center justify-content-center" id="aboutTriggerBtn" data-bs-toggle="modal" data-bs-target="#aboutModal" style="width: 2rem; height: 2rem;" aria-label="About" title="About">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </button>
          <a href="index.html" target="alerte-index" class="btn btn-light btn-sm rounded-pill" id="pageNavLink">Musique</a>
        </div>
        <div class="dropdown d-none" id="langDropdownWrap">
          <button class="btn btn-light btn-sm dropdown-toggle" type="button" id="langDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false"></button>
          <ul class="dropdown-menu dropdown-menu-end" id="langDropdownMenu" style="max-height: 60vh; overflow-y: auto;" aria-labelledby="langDropdownBtn"></ul>
        </div>
      </div>
    </div>

    <p id="loading" class="text-body-secondary">Chargement des paroles…</p>

    <div class="tab-content" id="langTabsContent"></div>
  </div>

  <div class="modal fade" id="aboutModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
        <div class="modal-body">
          <div class="row g-3 text-center mb-3">
            <div class="col-6">
              <img src="images/Mugnier.jpg" alt="Éric Mugnier, 1984" class="img-fluid rounded" style="aspect-ratio: 1; object-fit: cover; width: 100%;">
              <div class="small text-body-secondary mt-1">Éric Mugnier — <span class="about-then-label">1984</span></div>
            </div>
            <div class="col-6">
              <img src="images/Thiebaud.jpg" alt="Christophe Thiebaud, 1984" class="img-fluid rounded" style="aspect-ratio: 1; object-fit: cover; width: 100%;">
              <div class="small text-body-secondary mt-1">Christophe Thiebaud — <span class="about-then-label">1984</span></div>
            </div>
            <div class="col-6">
              <img src="images/Mugnier_now.jpg" alt="Éric Mugnier, now" class="img-fluid rounded" style="aspect-ratio: 1; object-fit: cover; width: 100%;">
              <div class="small text-body-secondary mt-1">Éric Mugnier — <span class="about-now-label">Now</span></div>
            </div>
            <div class="col-6">
              <img src="images/Thiebaud_now.jpg" alt="Christophe Thiebaud, now" class="img-fluid rounded" style="aspect-ratio: 1; object-fit: cover; width: 100%;">
              <div class="small text-body-secondary mt-1">Christophe Thiebaud — <span class="about-now-label">Now</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.min.js"></script>
  <script src="alerte-shared.js"></script>
  <script>
    // Name this tab so a link back from index.html (target="alerte-paroles")
    // reuses it instead of opening a new one, however this tab was opened.
    window.name = 'alerte-paroles';

    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.setAttribute('data-bs-theme', 'dark');
    }

    const headerLang = detectAlerteLang();
    document.getElementById('subtitleText').textContent = ALERTE_SUBTITLE_BY_LANG[headerLang];
    document.getElementById('subtitleLink').href = ALERTE_SUBTITLE_LINK_BY_LANG[headerLang];
    document.getElementById('subtitleCount').textContent = ALERTE_SUBTITLE_COUNT_BY_LANG[headerLang];
    document.getElementById('pageNavLink').textContent = ALERTE_NAV_LABELS.music[headerLang];
    document.getElementById('aboutTriggerBtn').title = ALERTE_ABOUT_LABELS[headerLang].trigger;
    document.getElementById('aboutTriggerBtn').setAttribute('aria-label', ALERTE_ABOUT_LABELS[headerLang].trigger);
    document.querySelectorAll('.about-then-label').forEach(el => el.textContent = ALERTE_ABOUT_LABELS[headerLang].then);
    document.querySelectorAll('.about-now-label').forEach(el => el.textContent = ALERTE_ABOUT_LABELS[headerLang].now);

    document.getElementById('pageNavLink').addEventListener('click', e => {
      e.preventDefault();
      openOrFocusNamed(e.currentTarget.href, 'alerte-index');
    });

    function linesFromInline(inline, startIndex) {
      const lines = [];
      let line = '';

      for (let i = startIndex; i < inline.length; i++) {
        const t = inline[i];
        if (t.type === 'br') {
          if (line) lines.push(line.trim());
          line = '';
        } else if (typeof t.text === 'string') {
          line += t.text;
        }
      }
      if (line) lines.push(line.trim());

      return lines;
    }

    function collapseRepeatedLines(lines) {
      const result = [];
      let i = 0;
      while (i < lines.length) {
        let j = i;
        while (j < lines.length && lines[j] === lines[i]) j++;
        const count = j - i;
        result.push({ text: lines[i], count: count >= 2 ? count : null });
        i = j;
      }
      return result;
    }

    function sortSections(sections) {
      if (sections.length === 0) return sections;
      const [original, ...rest] = sections;
      rest.sort((a, b) => a.title.localeCompare(b.title));
      return [original, ...rest];
    }

    function parseLyrics(markdown) {
      const tokens = marked.lexer(markdown);
      const sections = [];
      let current = null;
      let openBlock = null;

      tokens.forEach(token => {
        if (token.type === 'heading' && token.depth === 2) {
          current = { title: token.text, rtl: false, blocks: [] };
          sections.push(current);
          openBlock = null;
        } else if (token.type === 'html' && current) {
          if ((token.raw || '').includes('dir="rtl"')) current.rtl = true;
        } else if (token.type === 'hr') {
          openBlock = null;
        } else if (token.type === 'paragraph' && current) {
          const inline = token.tokens || [];
          const isLabeled = inline.length > 0 && inline[0].type === 'strong' && /^\[.+\]$/.test(inline[0].text);

          if (isLabeled) {
            const label = inline[0].text.replace(/^\[|\]$/g, '');
            openBlock = { label, lines: linesFromInline(inline, 1) };
            current.blocks.push(openBlock);
          } else if (openBlock) {
            // A stray blank-but-not-empty line in the source can split one
            // lyric block into two markdown paragraphs (e.g. a stylistic
            // pause). Re-attach it to the block still open instead of
            // dropping it.
            openBlock.lines.push('', ...linesFromInline(inline, 0));
          }
        }
      });

      return sections.filter(section => section.blocks.length > 0);
    }

    const TITLE_TO_CODE = {
      'Français (original)': 'fr',
      'Italiano': 'it',
      'Deutsch': 'de',
      'English': 'en',
      'Español (Sudamérica)': 'es',
      'Українська': 'ua',
      'English (hip-hop)': 'en-hh',
      'العربية (مصري)': 'ar',
      '한국어 (K-pop)': 'ko',
      'Español (Andalucía)': 'es-fl',
      'Gàidhlig': 'gd',
      'Português (Brasil)': 'pt-br',
      'Português (Portugal)': 'pt-pt',
      'Latina': 'la',
      'Deutsch (Sprechgesang)': 'de-sg',
      'English (Delta blues)': 'en-blues',
      'Монгол': 'mn',
      'Русский': 'ru',
      '日本語': 'ja',
      'עברית': 'he'
    };

    function getLangCode(title, index) {
      return TITLE_TO_CODE[title] || ('lang-' + index);
    }

    function renderLyrics(sections) {
      const dropdownWrap = document.getElementById('langDropdownWrap');
      const dropdownBtn = document.getElementById('langDropdownBtn');
      const dropdownMenu = document.getElementById('langDropdownMenu');
      const contentEl = document.getElementById('langTabsContent');
      const ids = sections.map((section, i) => getLangCode(section.title, i));
      const requestedTab = window.location.hash.slice(1);
      const activeId = ids.includes(requestedTab) ? requestedTab : ids[0];

      function activatePane(id) {
        document.querySelectorAll('#langTabsContent .tab-pane').forEach(pane => {
          pane.classList.toggle('show', pane.id === id);
          pane.classList.toggle('active', pane.id === id);
        });
        document.querySelectorAll('#langDropdownMenu .dropdown-item').forEach(item => {
          item.classList.toggle('active', item.dataset.langId === id);
          if (item.dataset.langId === id) dropdownBtn.textContent = item.textContent;
        });
      }

      // A link to paroles.html#<id> that reuses an already-open tab (named
      // target) only changes the hash — the page doesn't reload, so react
      // to that in-page navigation explicitly.
      window.addEventListener('hashchange', () => {
        const id = window.location.hash.slice(1);
        if (ids.includes(id)) activatePane(id);
      });

      sections.forEach((section, i) => {
        const id = ids[i];
        const isActive = id === activeId;

        const li = document.createElement('li');

        const item = document.createElement('a');
        item.className = 'dropdown-item' + (isActive ? ' active' : '');
        item.href = '#';
        item.dataset.langId = id;
        item.textContent = section.title;
        item.addEventListener('click', e => {
          e.preventDefault();
          activatePane(id);
          history.replaceState(null, '', '#' + id);
        });

        li.appendChild(item);
        dropdownMenu.appendChild(li);

        if (isActive) dropdownBtn.textContent = section.title;

        const pane = document.createElement('div');
        pane.className = 'tab-pane fade' + (isActive ? ' show active' : '');
        pane.id = id;
        if (section.rtl) pane.setAttribute('dir', 'rtl');

        section.blocks.forEach(block => {
          const label = block.label.trim();
          const isVerseOrChorus = /verse/i.test(label) || /chorus/i.test(label) || /^hook$/i.test(label) || /^refrain$/i.test(label);
          if (!isVerseOrChorus) return; // skip Intro/Instrumental/Outro/Dance break/etc.

          // Drop any line that is purely a Suno vocal/style direction
          // (e.g. a mid-block "[solo kargyraa throat singing]" cue), not
          // just a leading one.
          const lines = block.lines.filter(line => !/^\[.+\]$/.test(line.trim()));
          if (lines.length === 0) return; // purely instrumental block, e.g. "Pre-Chorus: instrumental..."

          const verse = document.createElement('div');
          verse.className = 'lyrics-verse';

          const labelEl = document.createElement('div');
          labelEl.className = 'lyrics-label text-uppercase text-body-secondary fw-semibold mb-1';
          labelEl.textContent = block.label;

          const text = document.createElement('p');
          text.className = 'lyrics-text';
          const collapsed = collapseRepeatedLines(lines);
          collapsed.forEach((line, idx) => {
            text.appendChild(document.createTextNode(line.text));
            if (line.count) {
              const badge = document.createElement('span');
              badge.className = 'repeat-count';
              badge.textContent = ` [×${line.count}]`;
              text.appendChild(badge);
            }
            if (idx < collapsed.length - 1) text.appendChild(document.createElement('br'));
          });

          verse.appendChild(labelEl);
          verse.appendChild(text);
          pane.appendChild(verse);
        });

        contentEl.appendChild(pane);
      });

      document.getElementById('loading').classList.add('d-none');
      dropdownWrap.classList.remove('d-none');
    }

    fetch('alerte-paroles.md')
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(markdown => renderLyrics(sortSections(parseLyrics(markdown))))
      .catch(err => {
        document.getElementById('loading').textContent =
          'Impossible de charger les paroles (' + err.message + ').';
      });
  </script>
</body>

</html>
