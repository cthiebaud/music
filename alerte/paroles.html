<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alerte — Paroles</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

  <style>
    body {
      padding: 2.5rem 1rem 4rem;
    }

    .lyrics-verse + .lyrics-verse {
      margin-top: 1.5rem;
    }

    .lyrics-label {
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .lyrics-text {
      white-space: pre-line;
      margin-bottom: 0;
    }

    [dir="rtl"] .lyrics-text {
      text-align: right;
    }

    .nav-tabs .nav-link {
      color: var(--bs-secondary-color);
    }

    .nav-tabs .nav-link.active {
      font-weight: 600;
    }

    .back-link {
      text-decoration: none;
    }
  </style>
</head>

<body data-bs-theme="light">
  <div class="container" style="max-width: 720px;">
    <a href="index.html" class="back-link small">&larr; Retour aux variations</a>

    <h1 class="h3 mt-3 mb-1">Alerte</h1>
    <p class="text-body-secondary mb-4">Paroles, en plusieurs langues</p>

    <p id="loading" class="text-body-secondary">Chargement des paroles…</p>

    <ul class="nav nav-tabs mb-4 d-none" id="langTabs" role="tablist"></ul>
    <div class="tab-content d-none" id="langTabsContent"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.min.js"></script>
  <script>
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.setAttribute('data-bs-theme', 'dark');
    }

    function linesFromInline(inline, startIndex) {
      const lines = [];
      let line = '';

      for (let i = startIndex; i < inline.length; i++) {
        const t = inline[i];
        if (t.type === 'br') {
          if (line) lines.push(line.trim());
          line = '';
        } else if (typeof t.text === 'string') {
          line += t.text;
        }
      }
      if (line) lines.push(line.trim());

      return lines;
    }

    function parseLyrics(markdown) {
      const tokens = marked.lexer(markdown);
      const sections = [];
      let current = null;
      let openBlock = null;

      tokens.forEach(token => {
        if (token.type === 'heading' && token.depth === 2) {
          current = { title: token.text, rtl: false, blocks: [] };
          sections.push(current);
          openBlock = null;
        } else if (token.type === 'html' && current) {
          if ((token.raw || '').includes('dir="rtl"')) current.rtl = true;
        } else if (token.type === 'hr') {
          openBlock = null;
        } else if (token.type === 'paragraph' && current) {
          const inline = token.tokens || [];
          const isLabeled = inline.length > 0 && inline[0].type === 'strong' && /^\[.+\]$/.test(inline[0].text);

          if (isLabeled) {
            const label = inline[0].text.replace(/^\[|\]$/g, '');
            openBlock = { label, lines: linesFromInline(inline, 1) };
            current.blocks.push(openBlock);
          } else if (openBlock) {
            // A stray blank-but-not-empty line in the source can split one
            // lyric block into two markdown paragraphs (e.g. a stylistic
            // pause). Re-attach it to the block still open instead of
            // dropping it.
            openBlock.lines.push('', ...linesFromInline(inline, 0));
          }
        }
      });

      return sections.filter(section => section.blocks.length > 0);
    }

    const TITLE_TO_CODE = {
      'Français (original)': 'fr',
      'Italiano': 'it',
      'Deutsch': 'de',
      'English': 'en',
      'Español (Venezuela)': 'es',
      'Українська': 'ua',
      'English (hip-hop version)': 'en-hh',
      'العربية (مصري)': 'ar'
    };

    function getLangCode(title, index) {
      return TITLE_TO_CODE[title] || ('lang-' + index);
    }

    function renderLyrics(sections) {
      const tabsEl = document.getElementById('langTabs');
      const contentEl = document.getElementById('langTabsContent');
      const ids = sections.map((section, i) => getLangCode(section.title, i));
      const requestedTab = window.location.hash.slice(1);
      const activeId = ids.includes(requestedTab) ? requestedTab : ids[0];

      sections.forEach((section, i) => {
        const id = ids[i];
        const isActive = id === activeId;

        const li = document.createElement('li');
        li.className = 'nav-item';
        li.setAttribute('role', 'presentation');

        const button = document.createElement('button');
        button.className = 'nav-link' + (isActive ? ' active' : '');
        button.id = id + '-tab';
        button.type = 'button';
        button.setAttribute('data-bs-toggle', 'tab');
        button.setAttribute('data-bs-target', '#' + id);
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-controls', id);
        button.setAttribute('aria-selected', String(isActive));
        button.textContent = section.title;

        li.appendChild(button);
        tabsEl.appendChild(li);

        const pane = document.createElement('div');
        pane.className = 'tab-pane fade' + (isActive ? ' show active' : '');
        pane.id = id;
        pane.setAttribute('role', 'tabpanel');
        pane.setAttribute('aria-labelledby', id + '-tab');
        if (section.rtl) pane.setAttribute('dir', 'rtl');

        section.blocks.forEach(block => {
          const verse = document.createElement('div');
          verse.className = 'lyrics-verse';

          const label = document.createElement('div');
          label.className = 'lyrics-label text-uppercase text-body-secondary fw-semibold mb-1';
          label.textContent = block.label;

          const text = document.createElement('p');
          text.className = 'lyrics-text';
          text.textContent = block.lines.join('\n');

          verse.appendChild(label);
          verse.appendChild(text);
          pane.appendChild(verse);
        });

        contentEl.appendChild(pane);
      });

      document.getElementById('loading').classList.add('d-none');
      tabsEl.classList.remove('d-none');
      contentEl.classList.remove('d-none');
    }

    fetch('alerte-paroles.md')
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(markdown => renderLyrics(parseLyrics(markdown)))
      .catch(err => {
        document.getElementById('loading').textContent =
          'Impossible de charger les paroles (' + err.message + ').';
      });
  </script>
</body>

</html>
